services:
  - type: web
    name: cyber-portfolio-api
    env: node
    plan: free
    buildCommand: npm install && npx vite build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: samuel
      - key: ADMIN_PASSWORD
        sync: false